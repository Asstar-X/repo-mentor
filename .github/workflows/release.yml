name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build & verify distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      - name: Verify tag matches pyproject version
        run: |
          python - <<'EOF'
          import os, re, sys
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = open("pyproject.toml", encoding="utf-8").read()
          section = text.split("[project]", 1)[1].split("\n[", 1)[0]
          version = re.search(r'^version\s*=\s*"([^"]+)"', section, re.MULTILINE).group(1)
          if tag != version:
              sys.exit(f"tag {tag!r} != pyproject version {version!r}")
          print(f"version OK: {version}")
          EOF

      - name: Build sdist and wheel
        run: hatch build

      - name: Assert wheel bundles the offline Mermaid asset
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
          if "repo_mentor/export/assets/mermaid.min.js" not in names:
              sys.exit("wheel is missing repo_mentor/export/assets/mermaid.min.js")
          print(f"asset OK in {wheel}")
          EOF

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Attach artifacts to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes